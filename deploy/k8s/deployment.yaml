apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtfm
  labels: {app: rtfm}
spec:
  replicas: 1 # tournaments are kept on one volume (ReadWriteOnce)
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: rtfm}
  template:
    metadata:
      labels: {app: rtfm}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rtfm
          image: rtfm
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 4200}
          env:
            - {name: RTFM_ADDR, value: ":4200"}
            - {name: RTFM_DATA, value: /data}
            - {name: RTFM_BLANK, value: /blank}
            - {name: RTFM_LOGS, value: /data/logs} # rtfm.log, and <id>.log per tournament
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: rtfm-data}
        - name: tmp
          emptyDir: {}
