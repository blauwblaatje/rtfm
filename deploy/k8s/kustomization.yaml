# kubectl apply -k deploy/k8s   (k3s: Traefik ingress, local-path storage)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rtfm
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: rtfm
    newName: ghcr.io/blauwblaatje/rtfm # or rtfm for an image loaded with make k3s-import (newTag: latest)
    newTag: 0.1.0 # a release: git tag v0.1.0
